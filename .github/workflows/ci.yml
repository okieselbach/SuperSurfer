name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release for the version in Cargo.toml"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  check:
    name: Lint and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  build-windows:
    name: Build Windows (Linux cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Cross-compile release binary
        run: bash packaging/windows/build-cross.sh

      - name: Verify artifact and PE version resource
        run: |
          test -f dist/supersurfer.exe
          python3 - <<'PY'
          import re
          from pathlib import Path

          version = re.search(r'^version = "([^"]+)"', Path("Cargo.toml").read_text(), re.M).group(1)
          data = Path("dist/supersurfer.exe").read_bytes()

          def u16(s: str) -> bytes:
              return s.encode("utf-16le")

          missing = [
              name
              for name in ("ProductName", "SuperSurfer", "FileVersion", version)
              if u16(name) not in data
          ]
          if missing:
              raise SystemExit(f"PE version resource missing UTF-16 strings: {missing}")
          print(f"PE version resource OK ({version})")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: supersurfer-windows
          path: dist/supersurfer.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux
    # Pin to the oldest supported Ubuntu LTS runner so the dynamically linked
    # glibc binary keeps a low compatibility floor ("minimum ubuntu").
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: Build Linux x86_64 package
        run: bash packaging/linux/build.sh

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Cross-compile Linux aarch64 package
        run: bash packaging/linux/build-cross.sh

      - name: Verify artifacts
        run: |
          test -f dist/linux/supersurfer
          test -f dist/linux-aarch64/supersurfer
          file dist/linux/supersurfer | grep -q 'x86-64'
          file dist/linux-aarch64/supersurfer | grep -q 'aarch64'

      - uses: actions/upload-artifact@v4
        with:
          name: supersurfer-linux
          path: dist/supersurfer-linux-*.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS
    # GitHub retired the macos-14 image on 2 November 2026.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Build app bundle
        run: bash packaging/macos/build-app.sh

      - name: Verify artifact
        run: |
          test -x dist/SuperSurfer.app/Contents/MacOS/SuperSurfer
          test -x dist/SuperSurfer.app/Contents/MacOS/set-default

      # Starts the built app, sends it a link the way macOS does, and checks
      # that it routed it and stayed loaded.
      - name: Smoke test
        run: bash packaging/macos/smoke-test.sh dist/SuperSurfer.app

      # Clicks real Dock icons and checks what Dock Click makes of them.
      - name: Dock click test
        run: bash packaging/macos/dock-click-test.sh dist/SuperSurfer.app

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/SuperSurfer.app dist/SuperSurfer.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: supersurfer-macos
          path: dist/SuperSurfer.app.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    # Three ways to get here: a pushed tag, a release created on github.com
    # (which pushes its tag), or a manual run on main with "release" ticked.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [check, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          notes="$(mktemp)"
          cat >"$notes" <<EOF
          SuperSurfer ${tag} binaries for Windows, macOS, and Linux.

          ### Downloads

          | Platform | Artifact |
          | --- | --- |
          | Windows x86_64 | \`supersurfer.exe\` |
          | macOS Apple Silicon | \`SuperSurfer.app.zip\` |
          | Linux x86_64 | \`supersurfer-linux-x86_64.tar.gz\` |
          | Linux aarch64 | \`supersurfer-linux-aarch64.tar.gz\` |

          **Windows:** run \`supersurfer.exe init --register\`, then set SuperSurfer as default under Settings → Apps → Default apps.

          **macOS:** unzip into \`/Applications\`. The app is not notarized yet, so macOS refuses a downloaded copy until you run \`xattr -cr /Applications/SuperSurfer.app\`. Then \`/Applications/SuperSurfer.app/Contents/MacOS/SuperSurfer register\`.

          **Linux:** extract the tarball for your arch and run \`./install.sh\`.

          See the [manual](https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/docs/manual.md).
          EOF
          assets=(
            artifacts/supersurfer-windows/supersurfer.exe
            artifacts/supersurfer-macos/SuperSurfer.app.zip
            artifacts/supersurfer-linux/supersurfer-linux-x86_64.tar.gz
            artifacts/supersurfer-linux/supersurfer-linux-aarch64.tar.gz
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              # These binaries come from whatever main is now, not from the
              # commit the existing release was tagged at.
              echo "::error::${tag} is already released. Bump the version before publishing again."
              exit 1
            fi
            # The release was created on github.com, which made the tag that
            # started this run. Add the binaries, and the notes if it has none.
            gh release upload "$tag" "${assets[@]}" --clobber
            if [ -z "$(gh release view "$tag" --json body --jq '.body')" ]; then
              gh release edit "$tag" --notes-file "$notes"
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # No tag yet: create it at the commit these binaries were built from.
            gh release create "$tag" "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "SuperSurfer ${tag}" \
              --notes-file "$notes"
          else
            gh release create "$tag" "${assets[@]}" \
              --title "SuperSurfer ${tag}" \
              --notes-file "$notes" \
              --verify-tag
          fi
